[workspace]
members = [
  "crates/pretix-webhook",
  "crates/pretix-webhook-cli",
  "crates/pretix-webhook-events",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sagikazarmark/pretix-webhook"
homepage = "https://github.com/sagikazarmark/pretix-webhook"

[workspace.dependencies]
pretix-webhook = { path = "crates/pretix-webhook", version = "0.1.0", default-features = false }
pretix-webhook-events = { path = "crates/pretix-webhook-events", version = "0.1.0" }

axum = { version = "0.8.4", default-features = false, features = ["json"] }
base64 = "0.23.1"
clap = { version = "4.5.42", features = ["derive", "env"] }
env_logger = { version = "0.11.8", features = ["kv"] }
http-body-util = "0.1.3"
log = { version = "0.4.27", features = ["kv"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sha2 = "0.11.0"
subtle = "2.6.1"
temp-env = "0.3.6"
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
toml = "1.1.4"
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
