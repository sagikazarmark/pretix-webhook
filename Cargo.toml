[workspace]
resolver = "3"
members = [ "crates/*" ]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sagikazarmark/pretix-webhook"
homepage = "https://github.com/sagikazarmark/pretix-webhook"

[workspace.dependencies]
pretix-webhook = { path = "crates/pretix-webhook", version = "0.1.0", default-features = false }
pretix-webhook-events = { path = "crates/pretix-webhook-events", version = "0.1.0" }

axum = { version = "0.8.4", default-features = false }
base64 = "0.23.1"
bytes = "1.10.1"
clap = { version = "4.5.42", features = ["derive", "env"] }
http = "1.3.1"
http-body = "1.0.1"
http-body-util = "0.1.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sha2 = "0.11.0"
subtle = "2.6.1"
temp-env = "0.3.6"
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
toml = "1.1.4"
tower = { version = "0.5.2", features = ["util"] }
tracing = { version = "0.1.41", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.19", features = ["fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
